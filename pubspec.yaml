name: namaz_alarm
description: A prayer reminder and wake-up challenge app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera and face detection
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1

  # QR code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Save settings and QR values
  shared_preferences: ^2.3.2

  # Export and share QR images
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Alarm sounds
  audioplayers: ^6.1.0

  # Select files
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
